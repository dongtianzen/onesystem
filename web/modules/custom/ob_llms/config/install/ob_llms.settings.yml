base_url: 'http://www.onebandsystem.com'
title: '万博 Oneband（北京万博信普通讯技术有限公司）'
summary: '万博 Oneband 是广播视频基础设施与专业视音频系统集成商，为媒体机构提供 5G 直播与远程制作、视音频处理、播出与存储、演播室与总控、传输与分发的端到端解决方案，以及系统集成、租赁、维修和 7×24 技术支持服务。授权代理及合作品牌包括 LiveU、Harmonic/MediaKind、Appear、SONY、PHABRIX、ETL 等。20 余年行业经验，500 余个客户部署案例。'
notes: 'Oneband is a broadcast video infrastructure and professional AV system integrator based in Beijing, China. English pages are available under /en/.'
