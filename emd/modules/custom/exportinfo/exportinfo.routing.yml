
# comments for Taxonomy Bundles - Vocabulary like program or Therapeutic Area or
exportinfo.program.comments:
  path: '/exportinfo/comments/{vocabulary}/{entity_id}/{start}/{end}'
  defaults:
    _controller: '\Drupal\exportinfo\Controller\ExportinfoController::exportVocabularyComments'
    _title: 'Export Program Comments'
  requirements:
    _permission: 'access content'

# single question
exportinfo.question.comments:
  path: '/exportinfo/comments/question/{question_tid}/{start}/{end}'
  defaults:
    _controller: '\Drupal\exportinfo\Controller\ExportinfoController::exportQuestionComments'
    _title: 'Export Question Comments'
  requirements:
    _permission: 'access content'

# guide page
exportinfo.guide.page:
  path: '/exportinfo/guide/page/{another}'
  defaults:
    _controller: '\Drupal\exportinfo\Controller\ExportinfoController::exportGuidePage'
    _title: 'Export Question Guide'
  requirements:
    _permission: 'access content'
