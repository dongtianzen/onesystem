
baseform.predefined_evaluation_form:
  path: '/baseform/form/predefined_evaluation'
  defaults:
    _form: '\Drupal\baseform\Form\PredefinedEvaluationForm'
    _title: 'PredefinedEvaluationForm'
  requirements:
    _permission: 'access content'

baseform.predefined_evaluation_page_controller_hello:
  path: '/baseform/hello/{name}'
  defaults:
    _controller: '\Drupal\baseform\Controller\PredefinedEvaluationPageController::hello'
    _title: 'label'
  requirements:
    _permission: 'access content'
